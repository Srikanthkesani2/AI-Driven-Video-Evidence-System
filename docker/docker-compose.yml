version: '3.8'

services:
  forensic-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: force-forensic-system
    ports:
      - "8000:8000"
    volumes:
      # Persist video uploads, structured JSON databases, generated reports, and logs
      - forensic-data:/app/data
    environment:
      # Set credentials if connecting to real Azure & Databricks clusters
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_API_KEY=${AZURE_API_KEY:-}
      - DATABRICKS_TOKEN=${DATABRICKS_TOKEN:-}
      - APP_DEBUG=true
    restart: unless-stopped

volumes:
  forensic-data:
    driver: local
